# percival-weather-mcp — Docker MCP Toolkit manifest
#
# Embedded at /mcp/mcp.yaml inside the image so the Docker MCP Toolkit
# gateway and other introspection tools can read a static description of
# what the container exposes without having to launch it first.
#
# This file is intentionally a superset of what the gateway strictly
# needs: it doubles as human-readable documentation for anyone
# inspecting the image with ``docker run --rm <image> cat /mcp/mcp.yaml``.

name: percival-weather-mcp
title: "Percival Weather, Air Quality and Time"
description: |
  Weather, air quality and time MCP server for the percival.OS
  ecosystem. Backed entirely by the public Open-Meteo APIs (no API
  keys required). Exposes nine tools, three prompts, three static
  resources and one resource template via FastMCP.
version: "0.9.0"
license: MIT
homepage: https://github.com/bill-kopp-ai-dev/percival-weather-mcp
source:
  project: https://github.com/bill-kopp-ai-dev/percival-weather-mcp
  directory: .

transport: stdio

# How the gateway should exec the server. The actual entrypoint is the
# docker-entrypoint.sh script, which honours $MCP_TRANSPORT and falls
# back to stdio when unset.
command:
  - /usr/local/bin/docker-entrypoint.sh
  - stdio

# Environment variables exposed by the runtime. ``default`` is the
# value the server uses when the operator does not override it.
environment:
  - name: MCP_TRANSPORT
    description: Transport selector. "stdio" (default) for the gateway, "http" for legacy deployments, "http-loopback" for local HTTP smoke tests.
    default: stdio
  - name: PORT
    description: Listening port when MCP_TRANSPORT=http.
    default: "8080"
  - name: MCP_WEATHER_HOST
    description: Bind host (HTTP transport only).
    default: "127.0.0.1"
  - name: MCP_WEATHER_AUTH_TOKEN_ENV
    description: Name of the env var that carries the bearer token (HTTP transport only).
    default: "MCP_WEATHER_AUTH_TOKEN"
  - name: MCP_WEATHER_HTTP_TIMEOUT
    description: Per-request upstream HTTP timeout in seconds.
    default: "15.0"
  - name: MCP_WEATHER_HTTP_MAX_RETRIES
    description: Retry attempts beyond the first try.
    default: "2"
  - name: MCP_WEATHER_HTTP_BACKOFF_BASE
    description: Base delay in seconds for exponential backoff.
    default: "0.3"
  - name: MCP_WEATHER_HTTP_BACKOFF_CAP
    description: Maximum delay in seconds between retries.
    default: "2.0"
  - name: MCP_WEATHER_HTTP_MAX_CONCURRENCY
    description: Maximum in-flight outbound HTTP requests.
    default: "16"
  - name: MCP_WEATHER_RATE_LIMIT_PER_MINUTE
    description: Per-IP request budget on HTTP transports.
    default: "120"
  - name: MCP_WEATHER_LOG_FORMAT
    description: "Log format: 'text' (default) or 'json'."
    default: "text"
  - name: MCP_WEATHER_ENABLE_METRICS
    description: Toggle Prometheus export (also surfaces at /metrics on HTTP).
    default: "true"
  - name: MCP_WEATHER_ENABLE_TRACING
    description: Enable OpenTelemetry tracing (requires the [otel] extra).
    default: "false"

# Tools advertised by the server. The canonical, machine-readable
# snapshot (with full JSON schemas) is generated by
# ``uv run python -m percival_weather_mcp.tool_export > docs/tools.json``
# and copied into the image as well.
tools:
  - name: weather_get_current
    description: Concise prose snapshot (temperature, humidity, wind, pressure, UV, visibility).
  - name: weather_get_by_range
    description: Statistics and an hourly sample for an inclusive date range (max 16 days).
  - name: weather_get_details
    description: All raw fields for the current conditions; optionally attach the next 24h of hourly forecast.
  - name: weather_get_air_quality
    description: Current conditions, per-pollutant averages, and a compact hourly sample.
  - name: weather_get_air_quality_details
    description: Full per-hour series for Open-Meteo air-quality fields.
  - name: weather_get_time
    description: Current local datetime for an IANA timezone.
  - name: weather_get_timezone
    description: UTC offset, DST flag, and timezone abbreviation.
  - name: weather_convert_time
    description: Convert an ISO 8601 datetime (or "now") between IANA timezones.
  - name: weather_get_status
    description: Liveness/readiness — name and version of the running server.

prompts:
  - weather_quick_answer
  - weather_analysis
  - weather_unit_conversion

resources:
  - weather://codes
  - weather://aqi
  - weather://timezones

resource_templates:
  - weather://schema/{tool_name}

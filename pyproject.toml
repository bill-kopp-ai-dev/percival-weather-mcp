[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "percival-weather-mcp"
version = "0.9.0"
authors = [
  { name = "danielshih", email = "dog830228@gmail.com" },
  { name = "percival.OS Team" },
]
description = "An MCP server for weather, air quality and time information (percival.OS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.12.0",
  "httpx>=0.23.1",
  "python-dotenv>=1.1.1",
  "python-dateutil>=2.8.2",
  "starlette>=0.27.0",
  "uvicorn>=0.20.0",
  "tzdata>=2025.2",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/percival_weather_mcp", "src/mcp_weather_server"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "respx>=0.21.1",
  "pyyaml>=6.0.3",
]

[project.scripts]
percival-weather-mcp = "percival_weather_mcp:main"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mcp.*", "starlette.*", "uvicorn.*", "prometheus_client.*", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

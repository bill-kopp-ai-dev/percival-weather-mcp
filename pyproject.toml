[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "percival-weather-mcp"
version = "0.6.1"
authors = [
  { name = "danielshih", email = "dog830228@gmail.com" },
]
description = "An MCP server for weather information"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.12.0",
  "httpx>=0.23.1",
  "python-dotenv>=1.1.1",
  "python-dateutil>=2.8.2",
  "starlette>=0.27.0",
  "uvicorn>=0.20.0",
  "tzdata>=2025.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/percival_weather_mcp", "src/mcp_weather_server"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
percival-weather-mcp = "percival_weather_mcp:main"
mcp_weather_server = "mcp_weather_server:main"

schema_version: "0.2"
id: pblabs.percival-weather
mcp_name: io.github.p-bean-labs/percival-weather-mcp
version: "0.9.0"
publisher: Positronic Bean Labs
source_class: official
runtime:
  container: true
  transport: stdio
  startup: on-demand
compatibility:
  products: [percival]
  platforms: [linux/amd64]
configuration:
  required_secrets: []
  writable_data: false
security:
  needs_network: true
mounts: []
lifecycle:
  owner: native-mcp-manager
  init:
    required: true
    provider: container-runtime
  restart_policy: manager-policy
  grace_period_seconds: null
  observed:
    readiness: mcp-initialize
    stdin_eof_exit_code: 0
    sigterm_exit_code: 143
    sigterm_shutdown_hook: ran
    sigint: exits
review:
  status: draft

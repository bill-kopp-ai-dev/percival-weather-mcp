name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + type-check + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.7"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy src/percival_weather_mcp

      - name: Run tests
        run: uv run pytest --cov=percival_weather_mcp --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  docker:
    name: Docker build + MCP conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Resolve image metadata
        id: meta
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build amd64 candidate (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: percival-weather-mcp:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check version and image identity
        run: |
          docker run --rm --entrypoint python percival-weather-mcp:ci -c 'from importlib.metadata import version; print(version("percival-weather-mcp"))'
          test "$(docker image inspect percival-weather-mcp:ci --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect percival-weather-mcp:ci --format '{{.Config.User}}')" != ""
          test "$(docker image inspect percival-weather-mcp:ci --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}')" = "$GITHUB_SHA"
      - name: MCP stdio conformance (offline)
        run: >-
          python3 scripts/docker-ci-conformance.py
          --image percival-weather-mcp:ci
          --expected-tool weather_convert_time
          --expected-uid 999
          --compose-service percival-weather-stdio
      - name: Render Compose contracts
        env:
          HTTP_PORT: "18080"
          MCP_WEATHER_AUTH_TOKEN: ci-weather-token-not-a-secret
        run: |
          docker compose config --quiet
          docker compose --profile http config --quiet
      - name: HTTP profile health, loopback bind and auth
        env:
          HTTP_PORT: "18080"
          MCP_WEATHER_AUTH_TOKEN: ci-weather-token-not-a-secret
        run: |
          docker compose --profile http up --build -d --wait percival-weather-http
          bind=$(docker compose --profile http port percival-weather-http 8080)
          test "$bind" = "127.0.0.1:18080"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/mcp)" = 401
          id=$(docker compose --profile http ps -q percival-weather-http)
          test "$(docker inspect --format '{{.State.Health.Status}}' "$id")" = healthy
          docker compose --profile http down --remove-orphans
      - name: Write build manifest
        run: python3 scripts/write_docker_ci_manifest.py --image percival-weather-mcp:ci --source-sha "$GITHUB_SHA" --lock uv.lock --output docker-build-manifest.json
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: percival-weather-mcp:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Upload image evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence-weather-${{ github.sha }}
          path: |
            docker-build-manifest.json
            sbom.cdx.json
          if-no-files-found: error

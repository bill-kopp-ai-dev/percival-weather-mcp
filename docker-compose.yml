# Local MCP runtime contracts for Percival Weather.
# Stdio: `docker compose run --rm -T percival-weather-stdio`.
# HTTP is opt-in and loopback-only by default, requires a bearer token, and
# must sit behind an authenticated TLS proxy/firewall before external access.

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: percival-weather-mcp:dev
  # The image's `app` account is UID/GID 999:999; pin the numeric identity so
  # permissions do not depend on a name lookup in the container.
  user: "999:999"
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &weather-environment
    MCP_WEATHER_LOG_FORMAT: ${MCP_WEATHER_LOG_FORMAT:-text}
    MCP_WEATHER_HTTP_TIMEOUT: ${MCP_WEATHER_HTTP_TIMEOUT:-15.0}
    MCP_WEATHER_HTTP_MAX_RETRIES: ${MCP_WEATHER_HTTP_MAX_RETRIES:-2}
    MCP_WEATHER_HTTP_BACKOFF_BASE: ${MCP_WEATHER_HTTP_BACKOFF_BASE:-0.3}
    MCP_WEATHER_HTTP_BACKOFF_CAP: ${MCP_WEATHER_HTTP_BACKOFF_CAP:-2.0}
    MCP_WEATHER_HTTP_MAX_CONCURRENCY: ${MCP_WEATHER_HTTP_MAX_CONCURRENCY:-16}
    MCP_WEATHER_RATE_LIMIT_PER_MINUTE: ${MCP_WEATHER_RATE_LIMIT_PER_MINUTE:-120}
    MCP_WEATHER_ENABLE_METRICS: ${MCP_WEATHER_ENABLE_METRICS:-true}
    MCP_WEATHER_ENABLE_TRACING: ${MCP_WEATHER_ENABLE_TRACING:-false}

services:
  percival-weather-stdio:
    <<: *common
    command: ["stdio"]
    stdin_open: true
    tty: false
    restart: "no"
    environment:
      <<: *weather-environment
      MCP_TRANSPORT: stdio

  percival-weather-http:
    <<: *common
    profiles: ["http"]
    command: ["http"]
    environment:
      <<: *weather-environment
      MCP_TRANSPORT: http
      MCP_WEATHER_HOST: 0.0.0.0
      PORT: "8080"
      # Read the credential from a mounted file in the wrapper below. It is
      # absent from the rendered config and container creation environment;
      # the server process receives it only after startup reads the file.
      MCP_WEATHER_AUTH_TOKEN_ENV: MCP_WEATHER_AUTH_TOKEN
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        MCP_WEATHER_AUTH_TOKEN="$$(cat /run/secrets/mcp_weather_auth_token)"
        export MCP_WEATHER_AUTH_TOKEN
        exec /usr/local/bin/docker-entrypoint.sh http
    secrets:
      - source: mcp_weather_auth_token
        target: mcp_weather_auth_token
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  # Docker Compose (non-swarm) supports file-backed local secrets. The source
  # file must be readable by UID 999 (e.g. mode 0644 inside a host directory
  # mode 0700); Docker mounts it read-only at this target.
  mcp_weather_auth_token:
    file: ${MCP_WEATHER_AUTH_TOKEN_FILE:-${HOME}/.config/percival/weather_auth_token}
